name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall src
      - name: Static checks
        run: python -m ruff check src tests
      - name: Offline tests
        env:
          LILITH_DATA_DIR: ${{ runner.temp }}\lilith-test-data
          LILITH_WORKSPACE: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

  linux-core:
    name: Linux core / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall src
      - name: Static checks
        run: python -m ruff check src tests
      - name: Portable core tests
        env:
          LILITH_DATA_DIR: ${{ runner.temp }}/lilith-test-data
          LILITH_WORKSPACE: ${{ github.workspace }}
        run: >-
          python -m unittest -v
          tests.test_model_gateway
          tests.test_migrations
          tests.test_reflection
          tests.test_intent
          tests.test_research
          tests.test_runtime
          tests.test_workshop
