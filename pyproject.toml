[project]
name = "lilith"
version = "0.1.0"
description = "Persistent local autonomous AI"
requires-python = ">=3.12"
dependencies = ["psutil>=6,<8", "textual>=8.2,<9"]

[project.optional-dependencies]
desktop = ["PyAutoGUI>=0.9.54,<1", "PyGetWindow>=0.0.9,<1", "Pillow>=11,<13"]

[project.scripts]
lilith = "lilith.home:main"
lilith-console = "lilith.main:main"
lilith-home = "lilith.home:main"
lilith-service = "lilith.service:main"
lilob = "lilith.lobotomize:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
